<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Practice Plan | Millersburg Lady Indians</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .qotd{border-left:6px solid var(--gold);background:var(--bg);padding:16px 18px;margin-bottom:22px}
  .qotd .lbl{font-family:var(--head);text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:700;font-size:.95rem;margin-bottom:6px}
  .qotd blockquote{margin:0;font-size:1.2rem;font-style:italic;line-height:1.45}
  .qotd cite{display:block;margin-top:8px;font-style:normal;font-weight:600;color:var(--muted)}
  .rem{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
  .rem li{background:var(--bg);border:1px solid var(--line);padding:10px 12px}
  .groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .grp{background:var(--bg);border:1px solid var(--line);border-top:5px solid var(--tc,var(--gold-d));padding:12px 14px}
  .grp h4{font-size:1.4rem;margin-bottom:8px}
  .grp h4 span{font-family:var(--body);font-size:.85rem;color:var(--muted);font-weight:500}
  .grp .wn{margin:0 0 8px;color:var(--muted);font-style:italic}
  .grp ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
  .courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .courts.full{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  .cfig{margin:0;background:#fff;border:1px solid var(--line);padding:8px;break-inside:avoid}
  .cfig canvas{width:100%;height:auto;display:block}
  h3.sec{font-size:1.6rem;margin:26px 0 12px}
  @media print{.pagehead{display:none!important}.grp{background:#fff;border-color:#777;border-top-color:#000}.courts{grid-template-columns:1fr 1fr}.noprint{display:none!important}}
</style>
</head>
<body data-page="practice-view">
<main id="main">
  <div class="pagehead"><div class="wrap"><h1>Practice <span>Plan</span></h1><p>Shared by your coach.</p></div></div>
  <section class="band"><div class="wrap" style="max-width:860px">
    <p id="status" class="meta" role="status" aria-live="polite"></p>
    <div class="panel" id="plan" style="display:none">
      <h2 id="ptitle" style="font-size:2.2rem"></h2>
      <p class="meta" id="pwhen"></p>
      <section class="qotd" id="qbox" style="display:none"><div class="lbl">Quote of the Day</div><blockquote id="qtext"></blockquote><cite id="qby"></cite></section>
      <ol class="blocks" id="blocks"></ol>
      <p class="total">Total: <b id="tot">0</b> min &middot; Ends <b id="end">--</b></p>
      <section id="remsec" style="display:none"><h3 class="sec">Reminders</h3><ul class="rem" id="rem"></ul></section>
      <section id="teamsec" style="display:none"><h3 class="sec">Teams</h3><div class="groups" id="teams"></div><p id="out" style="margin:12px 0 0"></p></section>
      <section id="warmsec" style="display:none"><h3 class="sec">Warm-up Groups</h3><div class="groups" id="warm"></div></section>
      <section id="courtsec" style="display:none"><h3 class="sec">Court Diagrams</h3><div class="courts" id="courts"></div></section>
      <div class="toolbar noprint" style="margin-top:22px"><button class="btn sm" id="print" type="button">Print</button></div>
    </div>
  </div></section>
</main>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/playview.js"></script>
<script>
(async function(){
  var E=LI.esc, TCOL=['#7a0c24','#c99600','#2b6cb0','#2f855a','#6b46c1','#c05621'];
  function $(i){return document.getElementById(i)}
  var h=location.hash.match(/^#d=(.+)$/), d=null;
  if(h){ try{ d=await PlayView.decode(h[1]); }catch(e){} }
  if(!d||!Array.isArray(d.blocks)){ $('status').textContent=h?'That practice link looks damaged. Ask your coach to send it again.':'No practice plan here. Open the link your coach sent you. It should end with #d=...'; return; }

  function fmt(m){var hh=Math.floor(m/60)%24,mm=m%60;return ((hh%12)||12)+':'+String(mm).padStart(2,'0')+' '+(hh>=12?'PM':'AM');}
  var st=(d.start||'15:30'), t=+st.slice(0,2)*60+ +st.slice(3,5), tot=0;
  var dt=d.date?new Date(d.date+'T12:00:00'):null;
  $('ptitle').textContent=d.title||'Practice Plan'; document.title=(d.title||'Practice Plan')+' | Millersburg Lady Indians';
  $('pwhen').textContent=(dt?dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+' · ':'')+'Start '+fmt(t);
  if(d.quote&&d.quote.text&&!d.quote.blank){ $('qbox').style.display=''; $('qtext').textContent='“'+d.quote.text+'”'; $('qby').textContent=d.quote.by?'— '+d.quote.by:''; }
  $('blocks').innerHTML=d.blocks.map(function(b){
    var s=t, m=Math.max(1,+b.min||1); t+=m; tot+=m;
    return '<li class="block"><span class="t">'+fmt(s)+'</span><span class="n">'+E(b.name)+' <small>'+(b.notes?E(b.notes):'')+'</small></span><span class="mins">'+m+' min</span></li>';
  }).join('')||'<li class="empty">No blocks in this plan.</li>';
  $('tot').textContent=tot; $('end').textContent=fmt(t);
  if(d.rems&&d.rems.length){ $('remsec').style.display=''; $('rem').innerHTML=d.rems.map(function(r){return '<li>'+E(r)+'</li>';}).join(''); }
  function groups(list,colored){
    return list.map(function(g,i){
      return '<div class="grp"'+(colored?' style="--tc:'+TCOL[i%TCOL.length]+'"':'')+'><h4>'+E(g.name)+' <span>('+g.players.length+')</span></h4>'+(g.notes?'<p class="wn">'+E(g.notes)+'</p>':'')+
        '<ul>'+(g.players.map(function(p){return '<li>'+E(p)+'</li>';}).join('')||'<li style="color:var(--muted);font-style:italic">No players yet</li>')+'</ul></div>';
    }).join('');
  }
  if(d.teams&&d.teams.some(function(g){return g.players.length;})){ $('teamsec').style.display=''; $('teams').innerHTML=groups(d.teams,true); }
  if(d.out&&d.out.length){ $('teamsec').style.display=''; $('out').innerHTML='<b>Not at practice:</b> '+d.out.map(E).join(', '); }
  if(d.warm&&d.warm.some(function(g){return g.players.length;})){ $('warmsec').style.display=''; $('warm').innerHTML=groups(d.warm,false); }
  if(d.courts&&d.courts.n>0){
    var type=d.courts.type==='full'?'full':'half', box=$('courts'), fake={court:type,steps:[{off:[],def:[],ball:null,lines:[]}]}, html='';
    $('courtsec').style.display=''; box.className='courts'+(type==='full'?' full':'');
    for(var i=0;i<Math.min(d.courts.n,8);i++) html+='<figure class="cfig"><canvas width="600" height="'+(type==='full'?1128:564)+'" role="img" aria-label="Blank '+type+' court diagram '+(i+1)+'"></canvas></figure>';
    box.innerHTML=html; box.querySelectorAll('canvas').forEach(function(cv){PlayView.render(cv,fake,0,null,false,true);});
  }
  $('plan').style.display='';
  $('print').onclick=function(){window.print();};
})();
</script>
</body>
</html>
