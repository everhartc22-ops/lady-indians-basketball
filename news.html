<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News & Recaps | Millersburg Lady Indians</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .manage{display:none;gap:8px;flex-wrap:wrap;margin-bottom:18px;padding:16px;background:#fff4cf;border:1px solid var(--gold-d)}
  body.editing .manage{display:flex}
  .ncard-wrap{position:relative;display:flex}
  .ncard-wrap .ncard{width:100%}
  .ncard-wrap .edit{display:none;position:absolute;left:8px;top:8px;z-index:3;min-height:44px;padding:0 14px;background:var(--gold);color:#1a0b00;border:0;font-family:var(--head);font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;align-items:center}
  body.editing .ncard-wrap .edit{display:inline-flex}
  .nimg img{width:100%;height:100%;object-fit:cover}
  .nimg{overflow:hidden}
  .photoprev{width:200px;aspect-ratio:16/9;background:var(--maroon);display:grid;place-items:center;overflow:hidden;color:rgba(255,255,255,.5);font-size:.8rem;text-align:center}
  .photoprev img{width:100%;height:100%;object-fit:cover}
  .formrow{display:grid;gap:14px}
  @media(min-width:600px){.formrow.c2{grid-template-columns:1fr 1fr}}
  .story{white-space:pre-wrap}
  .empty-roster{padding:40px;text-align:center;border:2px dashed var(--line);color:var(--muted)}
</style>
</head>
<body data-page="news">
<main id="main">
  <div class="pagehead"><div class="wrap"><h1>News <span>&amp; Recaps</span></h1><p>Game recaps, announcements and team stories.</p></div></div>
  <section class="band"><div class="wrap">
    <div class="toolbar" style="justify-content:flex-end">
      <button class="btn sm ghost" id="mgr" aria-pressed="false">Manage stories</button>
    </div>
    <div class="manage" id="manage">
      <button class="btn sm" id="addbtn">+ Add story</button>
      <button class="btn sm ghost" id="export">Export backup</button>
      <label class="btn sm ghost" style="margin:0;color:var(--text)">Import backup<input type="file" id="import" accept="application/json" class="sr"></label>
      <button class="btn sm danger" id="wipe">Remove all stories</button>
      <p class="meta" style="flex-basis:100%;margin:6px 0 0;color:var(--muted)">The three newest stories appear in <b>In the Spotlight</b> on the home page. Stories are saved in this browser only. Use Export backup to keep a copy.</p>
    </div>
    <div class="grid g3" id="grid"></div>
  </div></section>
</main>

<dialog id="dlg" aria-labelledby="dn"><div class="dlg"></div></dialog>

<dialog id="formdlg" aria-labelledby="ft">
  <form class="dlg" id="nform">
    <h2 id="ft">Add story</h2>
    <div class="field"><label for="n-title">Headline</label><input id="n-title" required autocomplete="off"></div>
    <div class="formrow c2">
      <div class="field"><label for="n-date">Date</label><input id="n-date" type="date" required></div>
      <div class="field"><label for="n-tag">Label</label><input id="n-tag" list="tags" placeholder="e.g. Recap" maxlength="20" autocomplete="off"><datalist id="tags"><option>Recap</option><option>Team</option><option>Announcement</option><option>Tickets</option><option>Award</option><option>Schedule</option></datalist></div>
    </div>
    <div class="field"><label for="n-ex">Short summary (shown on the card)</label><textarea id="n-ex" style="min-height:70px" maxlength="200" placeholder="Leave blank to use the start of the story"></textarea></div>
    <div class="field"><label for="n-body">Story</label><textarea id="n-body" style="min-height:160px" placeholder="Write the full story here..."></textarea></div>
    <div class="field">
      <label for="n-photo">Photo (optional)</label>
      <div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap">
        <div class="photoprev" id="prev">No photo</div>
        <div><input type="file" id="n-photo" accept="image/*"><button type="button" class="btn sm ghost" id="rmphoto" style="margin-top:8px">Remove photo</button></div>
      </div>
    </div>
    <div class="toolbar" style="margin-top:8px">
      <button class="btn" type="submit">Save story</button>
      <button class="btn ghost" type="button" id="cancel">Cancel</button>
      <button class="btn danger" type="button" id="del" style="margin-left:auto">Delete story</button>
    </div>
  </form>
</dialog>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
(function(){
  var E=LI.esc, N=LI.getNews(), editing=false, editId=null, photo='';
  var dlg=document.getElementById('dlg'), fd=document.getElementById('formdlg');
  function $(i){return document.getElementById(i)}
  function fmt(n,long){return new Date(n.date+'T12:00').toLocaleDateString('en-US',long?{month:'long',day:'numeric',year:'numeric'}:{month:'short',day:'numeric',year:'numeric'})}
  function persist(){ if(!LI.saveNews(N)) alert('Could not save. Browser storage may be full or blocked. Try removing the photo.'); N=LI.getNews(); draw(); }

  function draw(){
    var g=$('grid');
    if(!N.length){ g.innerHTML='<div class="empty-roster" style="grid-column:1/-1">No stories yet. Choose <b>Manage stories</b> then <b>Add story</b>.</div>'; return; }
    g.innerHTML=N.map(function(n){
      return '<div class="ncard-wrap"><button class="ncard" data-id="'+E(n.id)+'"><div class="nimg">'+(n.photo?'<img src="'+n.photo+'" alt="">':E(n.tag||''))+'</div><div class="nbody"><time>'+fmt(n)+'</time><h3>'+E(n.title)+'</h3><p>'+E(n.excerpt)+'</p></div></button>'+
        '<button class="edit" data-edit="'+E(n.id)+'" aria-label="Edit '+E(n.title)+'">Edit</button></div>';
    }).join('');
    LI.reveal();
  }

  $('grid').addEventListener('click',function(e){
    var ed=e.target.closest('[data-edit]'); if(ed){ openForm(ed.dataset.edit); return; }
    var b=e.target.closest('.ncard'); if(!b) return;
    var n=N.filter(function(x){return x.id===b.dataset.id})[0]; if(!n) return;
    dlg.querySelector('.dlg').innerHTML='<button class="btn sm ghost x" id="cl">Close</button><p class="kicker" style="color:var(--accent)">'+E(n.tag||'')+' &middot; '+fmt(n,true)+'</p><h2 id="dn">'+E(n.title)+'</h2>'+
      (n.photo?'<img src="'+n.photo+'" alt="" style="width:100%;margin:12px 0;border:3px solid var(--gold)">':'')+'<p class="story">'+E(n.body||n.excerpt||'')+'</p>';
    dlg.showModal(); $('cl').addEventListener('click',function(){dlg.close()});
  });
  dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close()});

  var mgr=$('mgr');
  function setEditing(on){ editing=on; document.body.classList.toggle('editing',on); mgr.setAttribute('aria-pressed',on); mgr.textContent=on?'Done managing':'Manage stories'; }
  mgr.onclick=function(){ setEditing(!editing); };
  if(location.hash==='#manage') setEditing(true);

  var prev=$('prev');
  function setPrev(){ prev.innerHTML=photo?'<img src="'+photo+'" alt="Photo preview">':'No photo'; }
  function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function openForm(id){
    editId=id||null;
    var n=id?N.filter(function(x){return x.id===id})[0]:{};
    $('ft').textContent=id?'Edit story':'Add story';
    $('n-title').value=n.title||''; $('n-date').value=n.date||today(); $('n-tag').value=n.tag||'';
    $('n-ex').value=n.excerpt||''; $('n-body').value=n.body||''; $('n-photo').value='';
    photo=n.photo||''; setPrev();
    $('del').style.display=id?'':'none';
    fd.showModal();
  }
  $('addbtn').onclick=function(){openForm(null)};
  $('cancel').onclick=function(){fd.close()};
  fd.addEventListener('click',function(e){if(e.target===fd)fd.close()});

  $('n-photo').addEventListener('change',function(e){
    var f=e.target.files[0]; if(!f) return;
    var img=new Image(), url=URL.createObjectURL(f);
    img.onload=function(){
      var w=800, s=Math.min(1,w/img.width), c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      photo=c.toDataURL('image/jpeg',.75); URL.revokeObjectURL(url); setPrev();
    };
    img.onerror=function(){alert('That file could not be read as an image.')};
    img.src=url;
  });
  $('rmphoto').onclick=function(){photo='';$('n-photo').value='';setPrev();};

  $('nform').addEventListener('submit',function(e){
    e.preventDefault();
    var body=$('n-body').value.trim(), ex=$('n-ex').value.trim();
    if(!ex&&body) ex=body.replace(/\s+/g,' ').slice(0,140)+(body.length>140?'...':'');
    var rec={id:editId||LI.uid(),title:$('n-title').value.trim(),date:$('n-date').value,tag:$('n-tag').value.trim()||'News',excerpt:ex,body:body,photo:photo};
    var i=N.findIndex(function(x){return x.id===rec.id});
    if(i>-1) N[i]=rec; else N.push(rec);
    fd.close(); persist();
  });
  $('del').onclick=function(){
    if(!editId||!confirm('Delete this story?')) return;
    N=N.filter(function(x){return x.id!==editId}); fd.close(); persist();
  };
  $('wipe').onclick=function(){
    if(confirm('Remove ALL stories, including the sample stories? This cannot be undone.')){N=[];persist();}
  };

  $('export').onclick=function(){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(N,null,2)],{type:'application/json'}));
    a.download='lady-indians-news.json'; a.click();
  };
  $('import').addEventListener('change',function(e){
    var file=e.target.files[0]; if(!file) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result); if(!Array.isArray(d)) throw 0;
        if(!confirm('Replace the current stories with '+d.length+' imported story(ies)?')) return;
        N=d; persist();
      }catch(x){alert('That file is not a valid news backup.')}
    };
    r.readAsText(file); e.target.value='';
  });
  draw();
})();
</script>
</body>
</html>
