<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News & Recaps | Millersburg Lady Indians</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="news">
<main id="main">
  <div class="pagehead"><div class="wrap"><h1>News <span>&amp; Recaps</span></h1><p>Game recaps, announcements and team stories.</p></div></div>
  <section class="band"><div class="wrap">
    <p class="note">Sample articles. Edit <code>js/data.js</code> to publish real news.</p>
    <div class="grid g3" id="grid"></div>
  </div></section>
</main>
<dialog id="dlg" aria-labelledby="dn"><div class="dlg"></div></dialog>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
(function(){
  var N=LI_DATA.news.slice().sort(function(a,b){return b.date.localeCompare(a.date)}), E=LI.esc, dlg=document.getElementById('dlg');
  function d(n){return new Date(n.date+'T12:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}
  document.getElementById('grid').innerHTML=N.map(function(n){
    return '<button class="ncard reveal" data-id="'+n.id+'"><div class="nimg">'+E(n.tag)+'</div><div class="nbody"><time>'+d(n)+'</time><h3>'+E(n.title)+'</h3><p>'+E(n.excerpt)+'</p></div></button>';
  }).join('');
  LI.reveal();
  document.getElementById('grid').addEventListener('click',function(e){
    var b=e.target.closest('.ncard'); if(!b) return;
    var n=N.filter(function(x){return String(x.id)===b.dataset.id})[0];
    dlg.querySelector('.dlg').innerHTML='<button class="btn sm ghost x" id="cl">Close</button><p class="kicker">'+E(n.tag)+' &middot; '+d(n)+'</p><h2 id="dn">'+E(n.title)+'</h2><p>'+E(n.body)+'</p>';
    dlg.showModal(); document.getElementById('cl').addEventListener('click',function(){dlg.close()});
  });
  dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close()});
})();
</script>
</body>
</html>
