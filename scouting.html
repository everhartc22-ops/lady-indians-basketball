<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scouting Reports | Millersburg Lady Indians</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .sharebox{margin-top:16px;padding:14px;background:#fff4cf;border:1px solid var(--gold-d);color:#3d2d00}
  .sharebox input{margin:8px 0}
  .sharebox .acts{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body data-page="scouting">
<main id="main">
  <div class="pagehead"><div class="wrap"><h1>Scouting <span>Reports</span></h1><p>Document opponent tendencies and key players. Reports save in this browser and can be printed.</p></div></div>
  <section class="band"><div class="wrap designer" style="align-items:start">
    <form class="panel" id="form">
      <div class="row c3">
        <div class="field"><label for="opp">Opponent</label><input id="opp" required></div>
        <div class="field"><label for="gd">Game date</label><input id="gd" type="date"></div>
        <div class="field"><label for="rec">Record</label><input id="rec" placeholder="e.g. 8-3"></div>
      </div>
      <div class="row c2">
        <div class="field"><label for="pace">Pace</label><select id="pace"><option>Fast / transition</option><option>Balanced</option><option>Slow / half-court</option></select></div>
        <div class="field"><label for="defn">Primary defense</label><select id="defn"><option>Man-to-man</option><option>2-3 zone</option><option>1-3-1 zone</option><option>Full-court press</option><option>Mixed / varies</option></select></div>
      </div>

      <h3 style="margin:8px 0 10px;font-size:1.5rem">Key players</h3>
      <div id="players"></div>
      <button type="button" class="btn sm ghost noprint" id="addp" style="margin-bottom:20px">Add player</button>

      <div class="field"><label for="off">Offensive tendencies &amp; sets</label><textarea id="off"></textarea></div>
      <div class="field"><label for="de">Defensive tendencies</label><textarea id="de"></textarea></div>
      <div class="field"><label for="keys">Keys to the game</label><textarea id="keys"></textarea></div>
      <div class="toolbar noprint"><button class="btn" type="submit">Save report</button><button class="btn ghost" type="button" id="print">Print</button><button class="btn ghost" type="button" id="newr">New report</button><button class="btn ghost" type="button" id="share" aria-controls="sharebox">Share</button></div>
      <div class="sharebox noprint" id="sharebox" style="display:none">
        <b id="sharetitle">Share this report</b>
        <p style="margin:6px 0 4px;font-size:.9rem">Send it as a link, or copy it as plain text to paste into a text message or email.</p>
        <label for="sharelink" class="sr">Report link</label>
        <input id="sharelink" readonly>
        <div class="acts"><button class="btn sm" type="button" id="copylink">Copy link</button><button class="btn sm ghost" type="button" id="copytext">Copy as text</button><a class="btn sm ghost" id="openlink" href="#" target="_blank" rel="noopener">Open report page</a></div>
        <p style="margin:10px 0 0;font-size:.88rem" id="sharenote" role="status" aria-live="polite"></p>
      </div>
    </form>
    <div class="panel noprint">
      <h2>Saved reports</h2>
      <ul class="playlist" id="list"></ul>
    </div>
  </div></section>
</main>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/playview.js"></script>
<script>
(function(){
  var E=LI.esc, reports=LI.load('scouting',[]), curId=null;
  var ids=['opp','gd','rec','pace','defn','off','de','keys'];
  function prow(p){p=p||{};return '<div class="prow"><input aria-label="Jersey number" placeholder="#" value="'+E(p.n||'')+'"><input aria-label="Player name" placeholder="Name" value="'+E(p.name||'')+'"><input aria-label="Strengths" placeholder="Strengths" value="'+E(p.s||'')+'"><input aria-label="Weaknesses" placeholder="Weaknesses" value="'+E(p.w||'')+'"></div>';}
  var pl=document.getElementById('players');
  function setPlayers(arr){pl.innerHTML=(arr&&arr.length?arr:[{},{},{}]).map(prow).join('');}
  function getPlayers(){return Array.prototype.map.call(pl.querySelectorAll('.prow'),function(r){var i=r.querySelectorAll('input');return {n:i[0].value,name:i[1].value,s:i[2].value,w:i[3].value};}).filter(function(p){return p.n||p.name||p.s||p.w;});}
  document.getElementById('addp').onclick=function(){pl.insertAdjacentHTML('beforeend',prow());};
  setPlayers();

  function clear(){curId=null;ids.forEach(function(i){var e=document.getElementById(i);e.value=e.tagName==='SELECT'?e.options[0].value:'';});setPlayers();}
  function list(){
    document.getElementById('list').innerHTML=reports.length?reports.map(function(r){return '<li><span>'+E(r.v.opp)+' <small style="color:var(--muted)">'+E(r.v.gd||'')+'</small></span><button class="btn sm ghost" data-open="'+r.id+'">Open</button><button class="btn sm ghost" data-share="'+r.id+'">Share</button><button class="btn sm danger" data-del="'+r.id+'" aria-label="Delete '+E(r.v.opp)+'">Delete</button></li>';}).join(''):'<li class="empty" style="border:none;background:none">No saved reports.</li>';
  }
  document.getElementById('list').addEventListener('click',function(e){
    var o=e.target.dataset.open,d=e.target.dataset.del;
    if(o){var r=reports.filter(function(x){return x.id===o})[0];curId=r.id;ids.forEach(function(i){document.getElementById(i).value=r.v[i]||'';});setPlayers(r.players);}
    if(d&&confirm('Delete this report?')){reports=reports.filter(function(x){return x.id!==d});LI.save('scouting',reports);list();}
  });
  document.getElementById('form').addEventListener('submit',function(e){
    e.preventDefault();
    var v={};ids.forEach(function(i){v[i]=document.getElementById(i).value;});
    var rec={id:curId||LI.uid(),v:v,players:getPlayers()};
    var i=reports.findIndex(function(x){return x.id===rec.id}); if(i>-1)reports[i]=rec; else reports.unshift(rec);
    curId=rec.id; LI.save('scouting',reports); list();
  });
  document.getElementById('newr').onclick=clear;
  document.getElementById('print').onclick=function(){window.print();};

  /* ---------- Sharing ---------- */
  function currentReport(){
    var v={}; ids.forEach(function(i){v[i]=document.getElementById(i).value;});
    return {v:v,players:getPlayers()};
  }
  function fmtDate(s){ if(!s) return ''; var d=new Date(s+'T12:00:00'); return isNaN(d)?s:d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}); }
  function asText(r){
    var v=r.v, L=[];
    L.push('SCOUTING REPORT: '+(v.opp||'Opponent').toUpperCase());
    var facts=[]; if(v.gd) facts.push('Game: '+fmtDate(v.gd)); if(v.rec) facts.push('Record: '+v.rec); if(v.pace) facts.push('Pace: '+v.pace); if(v.defn) facts.push('Defense: '+v.defn);
    if(facts.length) L.push(facts.join(' | '));
    if(r.players.length){ L.push('','KEY PLAYERS'); r.players.forEach(function(p){
      L.push('#'+(p.n||'?')+(p.name?' '+p.name:'')+(p.s?' - Strengths: '+p.s:'')+(p.w?' - Weaknesses: '+p.w:'')); }); }
    [['OFFENSE',v.off],['DEFENSE',v.de],['KEYS TO THE GAME',v.keys]].forEach(function(s){ if(s[1]&&s[1].trim()) L.push('',s[0],s[1].trim()); });
    L.push('','Millersburg Lady Indians Basketball');
    return L.join('\n');
  }
  var shared=null, sbox=document.getElementById('sharebox'), snote=document.getElementById('sharenote');
  function copy(text,okMsg){
    function fallback(){ try{ var t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); var ok=document.execCommand('copy'); t.remove(); snote.textContent=ok?okMsg:'Could not copy. Select the link and press Ctrl+C.'; }catch(e){ snote.textContent='Could not copy. Select the link and press Ctrl+C.'; } }
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){snote.textContent=okMsg;},fallback); else fallback();
  }
  async function openShare(r){
    if(!r.v.opp||!r.v.opp.trim()){ alert('Enter an opponent name before sharing.'); document.getElementById('opp').focus(); return; }
    shared=r;
    try{
      var code=await PlayView.encode(r), link=new URL('scouting-report.html',location.href).href+'#d='+code;
      document.getElementById('sharetitle').textContent='Share: '+r.v.opp;
      document.getElementById('sharelink').value=link; document.getElementById('openlink').href=link;
      var local=/^(file:|http:\/\/(localhost|127\.))/.test(location.href), n=[];
      if(local) n.push('The link only works once the site is online. Until then, use Copy as text.');
      if(link.length>6000) n.push('This link is long ('+link.length+' characters) and some apps may cut it off. Use Copy as text instead.');
      n.push('Anyone with the link can read this report. If you edit it, share again.');
      snote.textContent=n.join(' '); sbox.style.display='';
      sbox.scrollIntoView({block:'nearest'});
    }catch(e){ alert('Could not create the link in this browser. Use Copy as text instead.'); shared=r; sbox.style.display=''; }
  }
  document.getElementById('share').onclick=function(){ openShare(currentReport()); };
  document.getElementById('list').addEventListener('click',function(e){
    var id=e.target.dataset.share; if(!id) return;
    var rec=reports.filter(function(x){return x.id===id})[0]; if(rec) openShare({v:rec.v,players:rec.players||[]});
  });
  document.getElementById('copylink').onclick=function(){ copy(document.getElementById('sharelink').value,'Link copied.'); };
  document.getElementById('copytext').onclick=function(){ if(shared) copy(asText(shared),'Report copied as text. Paste it into a message or email.'); };

  list();
})();
</script>
</body>
</html>
